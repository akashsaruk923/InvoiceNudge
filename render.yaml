# Render.com blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then in Render: New > Blueprint > pick the repo.
services:
  - type: web
    name: invoicenudge
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Postgres connection string (libpq URL form is fine). Set to your Neon connection string.
      - key: DATABASE_URL
        sync: false
      # Secret guarding POST /internal/dispatch-reminders (used by the cron workflow).
      - key: Reminders__DispatchSecret
        generateValue: true
      # Keep the in-process worker on; the external cron is a backup.
      - key: Reminders__RunInProcessWorker
        value: "true"
      # Brevo transactional email — fill these in to actually send mail.
      - key: Email__Brevo__ApiKey
        sync: false
      - key: Email__Brevo__SenderEmail
        sync: false
      - key: Email__Brevo__SenderName
        value: InvoiceNudge
      # Optional Google OAuth.
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
