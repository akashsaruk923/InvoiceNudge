# Render.com blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard > New + > Blueprint > pick this repo.
# Provisions a free Postgres and a free Docker web service, wired together.

databases:
  - name: invoicenudge-db
    plan: free
    region: singapore
    databaseName: invoicenudge
    user: invoicenudge

services:
  - type: web
    name: invoicenudge
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invoicenudge-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_hostBuilder__reloadConfigOnChange
        value: "false"
      # Secret guarding POST /internal/dispatch-reminders (external reminder cron).
      - key: Reminders__DispatchSecret
        generateValue: true
      - key: Reminders__RunInProcessWorker
        value: "true"
      # Brevo transactional email — set these to actually send mail (else reminders log only).
      - key: Email__Brevo__ApiKey
        sync: false
      - key: Email__Brevo__SenderEmail
        sync: false
      - key: Email__Brevo__SenderName
        value: InvoiceNudge
      # Optional Google OAuth.
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
